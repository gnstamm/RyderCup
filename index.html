<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Stone Ryder Cup Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            padding: 1.5rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .loading {
            padding: 2rem;
            text-align: center;
            color: #666;
        }

        .leaderboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .team-card {
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            color: white;
        }

        .team-card.blue {
            background: #1e40af;
        }

        .team-card.red {
            background: #dc2626;
        }

        .team-card.center {
            background: white;
            border: 2px solid #fbbf24;
            color: #1a1a1a;
        }

        .team-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .team-score {
            font-size: 48px;
            font-weight: 500;
            line-height: 1;
        }

        .team-subtitle {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.7;
        }

        .center .team-score {
            color: #fbbf24;
            font-size: 32px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 0.5px solid #ddd;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
        }

        .tab-btn.active {
            background: #1e40af;
            color: white;
            border: none;
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            margin: 0 0 1rem;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
        }

        h3 {
            font-size: 14px;
            font-weight: 500;
            color: #666;
            margin-bottom: 12px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .match-card {
            background: white;
            border: 0.5px solid #ddd;
            border-radius: 12px;
            padding: 12px;
        }

        .match-card.closed {
            opacity: 0.75;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .match-format {
            font-size: 12px;
            font-weight: 500;
            color: #666;
        }

        .lead-badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 600;
            white-space: nowrap;
        }

        .lead-badge.blue {
            background: #dbeafe;
            color: #1e40af;
        }

        .lead-badge.red {
            background: #fee2e2;
            color: #dc2626;
        }

        .lead-badge.tied {
            background: #f3f0ff;
            color: #7c3aed;
        }

        .match-content {
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .player-row:last-child {
            margin-bottom: 0;
        }

        .player-name {
            font-weight: 500;
        }

        .big-score {
            text-align: center;
            font-size: 40px;
            font-weight: 700;
            line-height: 1;
            margin: 6px 0 10px;
        }

        .big-score.blue {
            color: #1e40af;
        }

        .big-score.red {
            color: #dc2626;
        }

        .big-score.tied {
            color: #7c3aed;
        }

        .hole-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 0.5px solid #ddd;
        }

        .hole-item {
            text-align: center;
            padding: 6px 4px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            background: #f5f5f5;
            border: 0.5px solid #ddd;
            user-select: none;
        }

        .hole-item.blue {
            background: #dbeafe;
            color: #1e40af;
            font-weight: 600;
        }

        .hole-item.red {
            background: #fee2e2;
            color: #dc2626;
            font-weight: 600;
        }

        .hole-item.halved {
            background: #f3f0ff;
            color: #7c3aed;
            font-weight: 600;
        }

        .hole-label {
            font-size: 10px;
            color: #999;
        }

        .match-status-line {
            font-size: 12px;
            font-weight: 500;
            color: #666;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 0.5px solid #ddd;
            text-align: center;
        }

        .match-status-line.closed-text {
            color: #1a1a1a;
            font-weight: 600;
        }

        .reset-btn {
            width: 100%;
            margin-top: 8px;
            padding: 6px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 6px;
            border: 0.5px solid #ddd;
            background: white;
            color: #999;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .session-summary {
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
            font-size: 12px;
            color: #666;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content" class="loading">Connecting to live scoreboard...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyDsKo_OodYe9nSuurTL-nBZvoD6Cl0Kd1w",
            authDomain: "ryder-cup-4468a.firebaseapp.com",
            databaseURL: "https://ryder-cup-4468a-default-rtdb.firebaseio.com",
            projectId: "ryder-cup-4468a",
            storageBucket: "ryder-cup-4468a.firebasestorage.app",
            messagingSenderId: "229464569992",
            appId: "1:229464569992:web:5438922b7cd25e6d4dc73d",
            measurementId: "G-76SFCVTBE0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tournamentRef = db.ref("tournament");

        const defaultTournament = {
            teamBlue: {
                name: "Team Blue",
                players: ["Ryan", "Grayson", "Brad", "Vinny", "Aaron", "Mason"],
                handicaps: { Ryan: 5, Grayson: 5, Brad: 14, Vinny: 14, Aaron: 16, Mason: 19 }
            },
            teamRed: {
                name: "Team Red",
                players: ["Dave", "Greg", "Charlie", "Jake", "Kevin", "Jarrett"],
                handicaps: { Dave: 5, Greg: 12, Charlie: 13, Jake: 14, Kevin: 14, Jarrett: 15 }
            },
            day1: [
                {
                    session: 1, holes: "1-6", holeRange: [1, 2, 3, 4, 5, 6], course: "Shenendoah",
                    matches: [
                        { id: "1-1", format: "Best Ball", playerA1: "Brad", playerA2: "Mason", playerB1: "Jake", playerB2: "Jarrett", pointsWorth: 1, holeResults: [0,0,0,0,0,0] },
                        { id: "1-2", format: "Best Ball", playerA1: "Charlie", playerA2: "Aaron", playerB1: "Vinny", playerB2: "Kevin", pointsWorth: 1, holeResults: [0,0,0,0,0,0] },
                        { id: "1-3", format: "Singles", playerA1: "Ryan", playerB1: "Greg", pointsWorth: 1, holeResults: [0,0,0,0,0,0] }
                    ]
                },
                {
                    session: 2, holes: "7-12", holeRange: [7, 8, 9, 10, 11, 12], course: "Shenendoah",
                    matches: [
                        { id: "1-4", format: "Best Ball", playerA1: "Ryan", playerA2: "Aaron", playerB1: "Greg", playerB2: "Vinny", pointsWorth: 1, holeResults: [0,0,0,0,0,0] },
                        { id: "1-5", format: "Best Ball", playerA1: "Brad", playerA2: "Vinny", playerB1: "Greg", playerB2: "Jake", pointsWorth: 1, holeResults: [0,0,0,0,0,0] },
                        { id: "1-6", format: "Singles", playerA1: "Mason", playerB1: "Kevin", pointsWorth: 1, holeResults: [0,0,0,0,0,0] }
                    ]
                },
                {
                    session: 3, holes: "13-18", holeRange: [13, 14, 15, 16, 17, 18], course: "Shenendoah",
                    matches: [
                        { id: "1-7", format: "Best Ball", playerA1: "Ryan", playerA2: "Brad", playerB1: "Greg", playerB2: "Kevin", pointsWorth: 1, holeResults: [0,0,0,0,0,0] },
                        { id: "1-8", format: "Best Ball", playerA1: "Vinny", playerA2: "Mason", playerB1: "Jake", playerB2: "Jarrett", pointsWorth: 1, holeResults: [0,0,0,0,0,0] },
                        { id: "1-9", format: "Singles", playerA1: "Aaron", playerB1: "Charlie", pointsWorth: 1, holeResults: [0,0,0,0,0,0] }
                    ]
                }
            ],
            day2: [
                {
                    round: "Scrambles", holeRange: [1,2,3,4,5,6,7,8,9], course: "Atunyote",
                    matches: [
                        { id: "2-1", format: "2-Man Scramble", playerA1: "Ryan", playerA2: "Mason", playerB1: "Dave", playerB2: "Jarrett", pointsWorth: 2, holeResults: [0,0,0,0,0,0,0,0,0] },
                        { id: "2-2", format: "2-Man Scramble", playerA1: "Grayson", playerA2: "Aaron", playerB1: "Greg", playerB2: "Jake", pointsWorth: 2, holeResults: [0,0,0,0,0,0,0,0,0] },
                        { id: "2-3", format: "2-Man Scramble", playerA1: "Brad", playerA2: "Vinny", playerB1: "Charlie", playerB2: "Kevin", pointsWorth: 2, holeResults: [0,0,0,0,0,0,0,0,0] }
                    ]
                },
                {
                    round: "Singles", holeRange: [10,11,12,13,14,15,16,17,18], course: "Atunyote",
                    matches: [
                        { id: "2-4", format: "Singles", playerA1: "Grayson", playerB1: "Dave", pointsWorth: 1, holeResults: [0,0,0,0,0,0,0,0,0] },
                        { id: "2-5", format: "Singles", playerA1: "Ryan", playerB1: "Greg", pointsWorth: 1, holeResults: [0,0,0,0,0,0,0,0,0] },
                        { id: "2-6", format: "Singles", playerA1: "Brad", playerB1: "Charlie", pointsWorth: 1, holeResults: [0,0,0,0,0,0,0,0,0] },
                        { id: "2-7", format: "Singles", playerA1: "Vinny", playerB1: "Jake", pointsWorth: 1, holeResults: [0,0,0,0,0,0,0,0,0] },
                        { id: "2-8", format: "Singles", playerA1: "Aaron", playerB1: "Jarrett", pointsWorth: 1, holeResults: [0,0,0,0,0,0,0,0,0] },
                        { id: "2-9", format: "Singles", playerA1: "Mason", playerB1: "Kevin", pointsWorth: 1, holeResults: [0,0,0,0,0,0,0,0,0] }
                    ]
                }
            ]
        };

        let currentTournament = null;
        let currentTab = "day1";

        tournamentRef.once("value").then(snapshot => {
            if (!snapshot.exists()) {
                tournamentRef.set(defaultTournament);
            }
        });

        tournamentRef.on("value", snapshot => {
            const data = snapshot.val();
            if (data) {
                currentTournament = data;
                renderApp();
            }
        });

        function saveTournament() {
            tournamentRef.set(currentTournament);
        }

        function findMatch(id) {
            for (const day of [currentTournament.day1, currentTournament.day2]) {
                for (const group of day) {
                    const match = group.matches.find(m => m.id === id);
                    if (match) return match;
                }
            }
            return null;
        }

        function getHandicap(playerName) {
            return currentTournament.teamBlue.handicaps[playerName]
                ?? currentTournament.teamRed.handicaps[playerName]
                ?? "?";
        }

        function formatPlayerName(playerName, handicap) {
            return `${playerName} (${handicap})`;
        }

        function getHoleNumberForMatch(matchId, holeIndex) {
            for (const day of [currentTournament.day1, currentTournament.day2]) {
                for (const group of day) {
                    if (group.matches.find(m => m.id === matchId)) {
                        return group.holeRange[holeIndex];
                    }
                }
            }
            return holeIndex + 1;
        }

        // Core rule engine: figures out, from the hole-by-hole results,
        // whether a match is still live, has been won outright ("closed out"
        // early, e.g. 3&2), or ended all square after every hole was played.
        function analyzeMatch(match) {
            const total = match.holeResults.length;
            let blue = 0, red = 0;
            let closedAtIndex = -1;
            let closedDiff = 0;

            for (let i = 0; i < total; i++) {
                const r = match.holeResults[i];
                if (r === 1) blue += 1;
                else if (r === -1) red += 1;
                else if (r === 0.5) { blue += 0.5; red += 0.5; }

                const holesRemaining = total - (i + 1);
                const diff = blue - red;
                if (closedAtIndex === -1 && r !== 0 && Math.abs(diff) > holesRemaining) {
                    closedAtIndex = i;
                    closedDiff = diff;
                }
            }

            const blueHolesWon = match.holeResults.filter(h => h === 1).length;
            const redHolesWon = match.holeResults.filter(h => h === -1).length;
            const halvedHoles = match.holeResults.filter(h => h === 0.5).length;
            const holesEntered = match.holeResults.filter(h => h !== 0).length;
            const liveDiff = blue - red;

            if (closedAtIndex !== -1) {
                const margin = Math.abs(closedDiff);
                const remaining = total - (closedAtIndex + 1);
                const winner = closedDiff > 0 ? "Blue" : "Red";
                const label = remaining > 0 ? `${margin}&${remaining}` : `${margin} UP`;
                return {
                    status: "closed",
                    winner,
                    resultBlue: closedDiff > 0 ? 1 : 0,
                    resultRed: closedDiff < 0 ? 1 : 0,
                    label: `${winner === "Blue" ? "Blue" : "Red"} wins ${label}`,
                    badgeText: label,
                    badgeColor: winner === "Blue" ? "blue" : "red",
                    blueHolesWon, redHolesWon, halvedHoles
                };
            }

            if (holesEntered === total) {
                // All holes played, never triggered an early close -> square
                return {
                    status: "halved",
                    winner: "Halved",
                    resultBlue: 0.5,
                    resultRed: 0.5,
                    label: "Match Halved (AS)",
                    badgeText: "AS",
                    badgeColor: "tied",
                    blueHolesWon, redHolesWon, halvedHoles
                };
            }

            // Still in progress
            let badgeText, badgeColor;
            if (liveDiff === 0) {
                badgeText = "AS";
                badgeColor = "tied";
            } else if (liveDiff > 0) {
                badgeText = `${liveDiff}`;
                badgeColor = "blue";
            } else {
                badgeText = `${Math.abs(liveDiff)}`;
                badgeColor = "red";
            }

            return {
                status: "in-progress",
                winner: null,
                resultBlue: 0,
                resultRed: 0,
                label: holesEntered === 0 ? "Not Started" : `Thru ${holesEntered}`,
                badgeText,
                badgeColor,
                blueHolesWon, redHolesWon, halvedHoles
            };
        }

        function calcScores() {
            let blueTotal = 0, redTotal = 0;
            for (const day of [currentTournament.day1, currentTournament.day2]) {
                for (const group of day) {
                    for (const m of group.matches) {
                        const a = analyzeMatch(m);
                        blueTotal += a.resultBlue * m.pointsWorth;
                        redTotal += a.resultRed * m.pointsWorth;
                    }
                }
            }
            return { blueTotal, redTotal };
        }

        function renderMatch(match) {
            const a = analyzeMatch(match);
            const hcp1 = getHandicap(match.playerA1);
            const hcp2 = match.playerA2 ? getHandicap(match.playerA2) : null;
            const hcp3 = getHandicap(match.playerB1);
            const hcp4 = match.playerB2 ? getHandicap(match.playerB2) : null;

            let html = `<div class="match-card ${a.status === 'closed' ? 'closed' : ''}">
                <div class="match-header">
                    <div class="match-format">${match.format}</div>
                </div>
                <div class="match-content">
                    <div class="player-row">
                        <span class="player-name">${formatPlayerName(match.playerA1, hcp1)}${match.playerA2 ? ' + ' + formatPlayerName(match.playerA2, hcp2) : ''}</span>
                    </div>
                    <div class="player-row">
                        <span class="player-name">${formatPlayerName(match.playerB1, hcp3)}${match.playerB2 ? ' + ' + formatPlayerName(match.playerB2, hcp4) : ''}</span>
                    </div>
                </div>
                <div class="big-score ${a.badgeColor}">${a.badgeText}</div>
                <div class="hole-grid">`;

            match.holeResults.forEach((result, idx) => {
                const holeNum = getHoleNumberForMatch(match.id, idx);
                let holeClass = '';
                if (result === 1) holeClass = 'blue';
                else if (result === -1) holeClass = 'red';
                else if (result === 0.5) holeClass = 'halved';

                html += `<div class="hole-item ${holeClass}" onclick="rotateHoleResult('${match.id}', ${idx})">
                    <div class="hole-label">#${holeNum}</div>
                    <div>${result === 0 ? '?' : result === 1 ? 'B' : result === -1 ? 'R' : 'H'}</div>
                </div>`;
            });

            html += `</div>
                <div class="match-status-line ${a.status === 'closed' || a.status === 'halved' ? 'closed-text' : ''}">${a.label}</div>
                <button class="reset-btn" onclick="resetMatch('${match.id}')">↺ Reset Match</button>
            </div>`;

            return html;
        }

        function renderApp() {
            const content = document.getElementById("content");
            content.className = "";
            const { blueTotal, redTotal } = calcScores();
            const leader = blueTotal > redTotal ? "Blue" : redTotal > blueTotal ? "Red" : "Tied";

            let html = `
                <h1>Turning Stone Ryder Cup</h1>
                <p class="subtitle">Shenendoah & Atunyote Golf Courses</p>

                <div class="leaderboard">
                    <div class="team-card blue">
                        <div class="team-label">TEAM BLUE</div>
                        <div class="team-score">${blueTotal}</div>
                        <div class="team-subtitle">of 21</div>
                    </div>
                    <div class="team-card center">
                        <div class="team-label">FIRST TO 11</div>
                        <div class="team-score">11</div>
                        <div class="team-subtitle">${leader === 'Blue' ? '🔵 Blue leads' : leader === 'Red' ? '🔴 Red leads' : 'Tied'}</div>
                    </div>
                    <div class="team-card red">
                        <div class="team-label">TEAM RED</div>
                        <div class="team-score">${redTotal}</div>
                        <div class="team-subtitle">of 21</div>
                    </div>
                </div>

                <div class="tabs">
                    <button class="tab-btn ${currentTab === 'day1' ? 'active' : ''}" onclick="switchTab('day1')">Day 1</button>
                    <button class="tab-btn ${currentTab === 'day2' ? 'active' : ''}" onclick="switchTab('day2')">Day 2</button>
                </div>
            `;

            if (currentTab === "day1") {
                html += `<h2>Day 1 — 5v5 Best Ball (9 Points)</h2>`;
                currentTournament.day1.forEach(session => {
                    html += `<h3>Session ${session.session} (Holes ${session.holes}) — ${session.course}</h3>
                        <div class="matches-grid">`;
                    session.matches.forEach(match => { html += renderMatch(match); });
                    const sb = session.matches.reduce((s, m) => s + analyzeMatch(m).resultBlue * m.pointsWorth, 0);
                    const sw = session.matches.reduce((s, m) => s + analyzeMatch(m).resultRed * m.pointsWorth, 0);
                    html += `</div><div class="session-summary">Blue: ${sb.toFixed(1)} | Red: ${sw.toFixed(1)}</div>`;
                });
            } else {
                html += `<h2>Day 2 — 6v6 (12 Points)</h2>`;
                currentTournament.day2.forEach(round => {
                    html += `<h3>${round.round} — ${round.course}</h3>
                        <div class="matches-grid">`;
                    round.matches.forEach(match => { html += renderMatch(match); });
                    const rb = round.matches.reduce((s, m) => s + analyzeMatch(m).resultBlue * m.pointsWorth, 0);
                    const rw = round.matches.reduce((s, m) => s + analyzeMatch(m).resultRed * m.pointsWorth, 0);
                    html += `</div><div class="session-summary">Blue: ${rb.toFixed(1)} | Red: ${rw.toFixed(1)}</div>`;
                });
            }

            content.innerHTML = html;
        }

        function switchTab(tab) {
            currentTab = tab;
            renderApp();
        }

        function rotateHoleResult(matchId, holeIndex) {
            const match = findMatch(matchId);
            if (!match) return;
            const current = match.holeResults[holeIndex];
            if (current === 0) match.holeResults[holeIndex] = 1;
            else if (current === 1) match.holeResults[holeIndex] = -1;
            else if (current === -1) match.holeResults[holeIndex] = 0.5;
            else match.holeResults[holeIndex] = 0;

            saveTournament();
        }

        function resetMatch(matchId) {
            const match = findMatch(matchId);
            if (!match) return;
            const confirmed = confirm(`Reset this match (${match.playerA1} vs ${match.playerB1})? All hole results for this match will be cleared. This cannot be undone.`);
            if (!confirmed) return;

            match.holeResults = match.holeResults.map(() => 0);
            saveTournament();
        }
    </script>
</body>
</html>
